<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEGATRON & MOUTH — Reservation Admin</title>
    <style>
      :root {
        --bg: #12110f;
        --panel: #1a1714;
        --panel-alt: #261f1b;
        --text: #f4efe9;
        --muted: #c4b7a8;
        --gold: #c9a66b;
        --line: rgba(255,255,255,0.09);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #120f0d 0%, #1b1714 100%);
        color: var(--text);
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px 70px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .badge {
        background: rgba(201, 166, 107, 0.12);
        color: var(--gold);
        border: 1px solid rgba(201, 166, 107, 0.35);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .panel {
        background: rgba(20, 17, 15, 0.9);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 16px 44px rgba(0,0,0,0.22);
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        padding: 16px 18px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        background: rgba(255,255,255,0.02);
        color: var(--gold);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      td {
        color: var(--text);
        font-size: 15px;
      }

      .muted {
        color: var(--muted);
      }

      .status {
        display: inline-block;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(201, 166, 107, 0.12);
        color: var(--gold);
      }

      .empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 820px) {
        table, thead, tbody, th, td, tr {
          display: block;
        }

        th {
          display: none;
        }

        tr {
          border-bottom: 1px solid var(--line);
        }

        td {
          border: none;
          padding: 12px 16px;
        }

        td::before {
          content: attr(data-label);
          display: block;
          color: var(--gold);
          font-size: 11px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          margin-bottom: 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <h1>Reservation Admin</h1>
        <span class="badge">Live bookings</span>
      </div>

      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Date</th>
              <th>Time</th>
              <th>Guests</th>
              <th>Status</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="reservation-body"></tbody>
        </table>
        <div class="empty" id="empty-state" hidden>No reservations yet.</div>
      </div>
    </div>

    <script>
      async function loadReservations() {
        const body = document.getElementById('reservation-body');
        const empty = document.getElementById('empty-state');

        try {
          const response = await fetch('/api/admin/reservations');
          const data = await response.json();

          if (!data.success || !Array.isArray(data.reservations)) {
            throw new Error('Invalid reservation payload');
          }

          if (data.reservations.length === 0) {
            body.innerHTML = '';
            empty.hidden = false;
            return;
          }

          empty.hidden = true;
          body.innerHTML = data.reservations.map((item) => {
            const safeName = item.name || 'Guest';
            const safeEmail = item.email || 'N/A';
            const safePhone = item.phone || 'N/A';
            const safeDate = item.date || 'TBD';
            const safeTime = item.time || 'TBD';
            const safeGuests = item.guests || 'N/A';
            const createdAt = item.createdAt ? new Date(item.createdAt).toLocaleString() : 'Unknown';

            return `
              <tr>
                <td data-label="Name">${safeName}</td>
                <td data-label="Email">${safeEmail}</td>
                <td data-label="Phone">${safePhone}</td>
                <td data-label="Date">${safeDate}</td>
                <td data-label="Time">${safeTime}</td>
                <td data-label="Guests">${safeGuests}</td>
                <td data-label="Status"><span class="status">Pending</span></td>
                <td data-label="Created" class="muted">${createdAt}</td>
              </tr>
            `;
          }).join('');
        } catch (error) {
          body.innerHTML = '';
          empty.hidden = false;
          empty.textContent = 'Unable to load reservations right now.';
        }
      }

      loadReservations();
      setInterval(loadReservations, 15000);
    </script>
  </body>
</html>
